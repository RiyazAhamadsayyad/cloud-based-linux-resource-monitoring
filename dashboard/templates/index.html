<!DOCTYPE html>
<html>
<head>
    <title>Linux Resource Monitor</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: white;
            width: 200px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .value {
            font-size: 35px;
            font-weight: bold;
        }

        .status {
            margin: 40px;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Linux Resource Monitoring Dashboard</h1>

<div class="container">

    <div class="card">
        <h2>CPU</h2>
        <div class="value">{{ cpu }}%</div>
    </div>

    <div class="card">
        <h2>Memory</h2>
        <div class="value">{{ memory }}%</div>
    </div>

    <div class="card">
        <h2>Disk</h2>
        <div class="value">{{ disk }}%</div>
    </div>

</div>

<div class="status">
    Status: {{ status }}
</div>

</body>
</html>
